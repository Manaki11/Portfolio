<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 : Séquence introuvable — Marko Peric</title>
  <meta name="description" content="La page demandée n'existe pas ou a été déplacée.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;600&family=Syne:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #090909;
      color: #ededeb;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .box {
      max-width: 480px;
      border: 1px solid #2e2e2e;
      background-color: #111111;
      padding: 36px;
    }
    .code {
      font-family: 'JetBrains Mono', monospace;
      color: #e04f26;
      font-size: 0.85rem;
      display: block;
      margin-bottom: 12px;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.8rem;
      margin: 0 0 12px;
    }
    p {
      color: #8a8a86;
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0 0 28px;
    }
    a {
      display: inline-block;
      background-color: #e04f26;
      color: #090909;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 22px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="box">
    <span class="code">ERREUR 404 // MÉDIA HORS LIGNE</span>
    <h1>Cette page n'existe pas.</h1>
    <p>Le lien que vous avez suivi est coupé ou la séquence a été déplacée.</p>
    <a href="https://manaki11.github.io/Portfolio/">Retourner au portfolio</a>

</html>
